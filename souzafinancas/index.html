<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2ecc71" />
  <meta name="description" content="Souza Finanças — Controlo financeiro pessoal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Souza Finanças" />
  <title>Souza Finanças</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">

  <!-- ══ HEADER estilo Monefy ══════════════════════════════ -->
  <header>
    <div class="header-left">
      <button class="hdr-icon-btn" id="btn-filtro" title="Filtro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </button>
      <div class="hdr-titulo">
        <h1>Souza Finanças</h1>
        <span class="header-sub">Todas as contas</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="hdr-icon-btn" id="btn-historico" title="Histórico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <button class="hdr-icon-btn" title="Transferir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 16V4m0 0L3 8m4-4 4 4M17 8v12m0 0 4-4m-4 4-4-4"/></svg>
      </button>
      <button class="hdr-icon-btn" id="btn-menu" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </div>
  </header>

  <!-- ══ PÁGINA INÍCIO ══════════════════════════════════════ -->
  <div id="pagina-inicio" class="pagina">

    <!-- Área principal: ícones + donut -->
    <div class="main-area">

      <!-- Coluna de ícones das categorias (esquerda) -->
      <div class="cats-col" id="cats-col"></div>

      <!-- Donut chart (centro/direita) -->
      <div class="donut-area">
        <canvas id="donut-canvas" width="240" height="240"></canvas>
      </div>

    </div>

    <!-- Barra de período e tabs -->
    <div class="mid-bar">
      <div class="tabs-tipo">
        <button class="tab-tipo ativo" data-tipo="despesa">Despesas</button>
        <button class="tab-tipo" data-tipo="receita">Receitas</button>
      </div>
      <div class="periodo-nav">
        <button class="periodo-btn" id="btn-mes-ant">‹</button>
        <span id="periodo-label">Agosto 2026</span>
        <button class="periodo-btn" id="btn-mes-seg">›</button>
      </div>
    </div>

  </div><!-- fim pagina-inicio -->

  <!-- ══ PÁGINAS SECUNDÁRIAS ════════════════════════════════ -->

  <div id="pagina-categorias" class="pagina hidden">
    <div class="pagina-header">
      <button class="btn-back">←</button>
      <h2>Categorias</h2>
      <button class="btn-add-item" id="btn-nova-cat">+</button>
    </div>
    <div id="lista-categorias"></div>
  </div>

  <div id="pagina-contas" class="pagina hidden">
    <div class="pagina-header">
      <button class="btn-back">←</button>
      <h2>Contas</h2>
    </div>
    <div id="lista-contas"></div>
  </div>

  <div id="pagina-historico" class="pagina hidden">
    <div class="pagina-header">
      <button class="btn-back">←</button>
      <h2>Histórico</h2>
    </div>
    <div id="lista-historico"></div>
  </div>

  <!-- ══ BARRA DE SALDO (fundo, estilo Monefy) ═════════════ -->
  <div class="saldo-bottom" id="saldo-bar">
    <span id="saldo-valor" class="sb-valor">R$ 0,00</span>
    <button class="sb-menu-btn" id="btn-sb-menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
  </div>

  <!-- ══ FAB único estilo Monefy ════════════════════════════ -->
  <div class="fab-wrap">
    <button class="fab-main" id="btn-fab-despesa" title="Adicionar gasto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

</div><!-- fim #app -->

<!-- ══ OVERLAY DRAWER ═════════════════════════════════════ -->
<div id="overlay-drawer"></div>

<!-- ══ DRAWER LATERAL estilo Monefy ══════════════════════ -->
<aside id="drawer">
  <ul class="drawer-menu">

    <li data-nav="categorias">
      <div class="dm-icone">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="13" height="20" rx="2"/>
          <line x1="4" y1="7" x2="4" y2="7"/>
          <line x1="9" y1="2" x2="9" y2="22"/>
          <line x1="13" y1="7" x2="17" y2="7"/>
          <line x1="13" y1="11" x2="17" y2="11"/>
          <line x1="13" y1="15" x2="17" y2="15"/>
        </svg>
      </div>
      <span>Categorias</span>
    </li>

    <li data-nav="contas">
      <div class="dm-icone">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="13" rx="2"/>
          <path d="M16 16a1 1 0 1 0 2 0 1 1 0 0 0-2 0z" fill="#2ecc71"/>
          <path d="M22 11V9a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2"/>
          <line x1="2" y1="11" x2="22" y2="11"/>
        </svg>
      </div>
      <span>Contas</span>
    </li>

    <li data-nav="moedas">
      <div class="dm-icone">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v1m0 8v1"/>
          <path d="M9.5 9.5A2.5 2.5 0 0 1 12 8a2.5 2.5 0 0 1 0 5 2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 2.5-1.5"/>
        </svg>
      </div>
      <span>Moedas</span>
    </li>

    <li id="li-configuracoes">
      <div class="dm-icone">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </div>
      <span>Configurações</span>
    </li>

    <li id="li-guias">
      <div class="dm-icone">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 1.657 2.686 3 6 3s6-1.343 6-3v-5"/>
        </svg>
      </div>
      <span>Guias</span>
    </li>

  </ul>
</aside>

<!-- ══ OVERLAY MODAL ══════════════════════════════════════ -->
<div id="overlay-modal"></div>

<!-- ══ MODAL: NOVA TRANSAÇÃO (calculadora) ═══════════════ -->
<div id="modal-transacao" class="modal">
  <div class="modal-handle"></div>
  <h2>
    <span id="modal-tipo" class="modal-tipo-badge despesa">− Despesa</span>
    <button class="btn-fechar-modal" id="btn-fechar-modal">×</button>
  </h2>

  <div class="calc-display" id="calc-display">
    <span class="calc-moeda" id="calc-moeda-simbolo">R$</span>
    <span class="calc-valor" id="calc-valor-display">0</span>
  </div>

  <div class="form-row">
    <div class="form-group" style="flex:1">
      <label>Categoria</label>
      <select id="modal-categoria"></select>
    </div>
    <div class="form-group" style="flex:1">
      <label>Conta</label>
      <select id="modal-conta"></select>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group" style="flex:1">
      <label>Data</label>
      <input type="date" id="modal-data" />
    </div>
    <div class="form-group" style="flex:1">
      <label>Nota</label>
      <input type="text" id="modal-nota" placeholder="Opcional..." />
    </div>
  </div>

  <div class="calc-teclado">
    <button class="calc-btn" data-val="7">7</button>
    <button class="calc-btn" data-val="8">8</button>
    <button class="calc-btn" data-val="9">9</button>
    <button class="calc-btn calc-btn-apagar" id="calc-apagar">⌫</button>

    <button class="calc-btn" data-val="4">4</button>
    <button class="calc-btn" data-val="5">5</button>
    <button class="calc-btn" data-val="6">6</button>
    <button class="calc-btn calc-btn-limpar" id="calc-limpar">C</button>

    <button class="calc-btn" data-val="1">1</button>
    <button class="calc-btn" data-val="2">2</button>
    <button class="calc-btn" data-val="3">3</button>
    <button class="calc-btn calc-btn-ok" id="btn-salvar-transacao">✓</button>

    <button class="calc-btn calc-btn-zero" data-val="0">0</button>
    <button class="calc-btn" data-val=",">,</button>
  </div>

  <input type="hidden" id="modal-valor" />
</div>

<!-- ══ MODAL: NOVA CATEGORIA ═════════════════════════════ -->
<div id="modal-nova-cat" class="modal">
  <div class="modal-handle"></div>
  <h2>
    Nova Categoria
    <button class="btn-fechar-modal" id="btn-fechar-nova-cat">×</button>
  </h2>
  <div class="form-group">
    <label>Nome</label>
    <input type="text" id="nova-cat-nome" placeholder="Ex: Academia" />
  </div>
  <div class="form-group">
    <label>Ícone (emoji)</label>
    <input type="text" id="nova-cat-icone" placeholder="🏋️" maxlength="2" style="text-align:center;font-size:28px" />
  </div>
  <div class="form-group">
    <label>Cor</label>
    <input type="color" id="nova-cat-cor" value="#2ecc71" style="height:44px;padding:4px" />
  </div>
  <div class="form-group">
    <label>Tipo</label>
    <select id="nova-cat-tipo">
      <option value="despesa">Despesa</option>
      <option value="receita">Receita</option>
    </select>
  </div>
  <button class="btn-primario" id="btn-salvar-cat">Criar Categoria</button>
</div>

<!-- ══ MODAL: DETALHE CATEGORIA ══════════════════════════ -->
<div id="modal-detalhe" class="modal">
  <div class="modal-handle"></div>
  <div style="display:flex;justify-content:flex-end">
    <button class="btn-fechar-modal" id="btn-fechar-det">×</button>
  </div>
  <div class="det-header">
    <h2 id="det-titulo">Categoria</h2>
    <div class="det-total" id="det-total">R$ 0,00</div>
    <div class="det-qtd" id="det-qtd">0 transações</div>
  </div>
  <div id="det-lista"></div>
</div>

<!-- ══ MODAL: SELECIONAR MOEDA ═══════════════════════════ -->
<div id="modal-moedas" class="modal">
  <div class="modal-handle"></div>
  <h2>
    Selecionar Moeda
    <button class="btn-fechar-modal" id="btn-fechar-moedas">×</button>
  </h2>
  <div id="lista-moedas-modal"></div>
</div>

<!-- ══ TOAST ══════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- ══ SCRIPTS ════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
<script>
  // Botão histórico no header
  document.getElementById('btn-historico').addEventListener('click', () => navegarPara('historico'));
  // Botão de saldo (hamburger) abre drawer
  document.getElementById('btn-sb-menu').addEventListener('click', abrirDrawer);
  // Moedas
  document.querySelector('[data-nav="moedas"]')?.addEventListener('click', () => {
    fecharDrawer();
    abrirModalMoedas();
  });

  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
